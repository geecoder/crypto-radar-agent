name: Check Alert Outcomes

on:
  schedule:
    # Every 6 hours — processes 50 unchecked outcomes per run, working through
    # the backlog of 779 alerts across ~16 runs (~4 days to full coverage).
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Max outcomes to check per run (default: 50)"
        required: false
        default: "50"
      max_minutes:
        description: "Stop after this many minutes to avoid timeout (default: 8)"
        required: false
        default: "8"

jobs:
  check-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      PERSISTENCE_BACKEND: supabase
      BINANCE_BASE_URL_ORDER: data-api,api1,api2,api3,api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check alert outcomes
        run: |
          python -m app.main --check-outcomes \
            --limit ${{ inputs.limit || '50' }} \
            --max-minutes ${{ inputs.max_minutes || '8' }}
